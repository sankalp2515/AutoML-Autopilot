version: 1
name: loan-scorer
python: "3.12"
install: "pip install -r requirements.txt"
commands:
  test: "pytest -q tests"
  train: "python -m scorer.train --data data/train.csv --out {artifacts}/model.joblib"
  predict: "python -m scorer.predict --model {artifacts}/model.joblib --input {holdout_features} --out {predictions}"
entrypoints:
  serve: "scorer.serve:score_request"
data:
  train: data/train.csv
  holdout_features: data/holdout_features.csv
  id_column: row_id
  target: outcome
  positive_label: 1
task:
  type: restore
  metric: roc_auc
  fail_to_pass: ["tests/test_service.py::test_service"]
  ml_invariants: ["train_serve_parity", "holdout_non_inferior"]
policy:
  allowed_edit_roots: ["scorer/", "tests/"]
  immutable: ["data/", "requirements.txt"]
  immutable_existing_tests: true
limits:
  test_seconds: 120
  train_seconds: 120
