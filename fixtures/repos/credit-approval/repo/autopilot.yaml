version: 1
name: credit-approval
python: "3.12"
install: "pip install -r requirements.txt"
commands:
  test: "pytest -q tests"
  train: "python -m credit.train --data data/train.csv --out {artifacts}/model.joblib"
  predict: "python -m credit.predict --model {artifacts}/model.joblib --input {holdout_features} --out {predictions}"
entrypoints:
  serve: "credit.serve:score_request"
data:
  train: data/train.csv
  holdout_features: data/holdout_features.csv
  id_column: row_id
  target: outcome
  positive_label: 1
  segment_column: region
  segment_max_drop: 0.03
task:
  type: improve
  metric: f1
  fail_to_pass: ["tests/test_service.py::test_quality"]
  ml_invariants: ["segment_guardrail", "holdout_non_inferior"]
policy:
  allowed_edit_roots: ["credit/", "tests/"]
  immutable: ["data/", "requirements.txt"]
  immutable_existing_tests: true
limits:
  test_seconds: 120
  train_seconds: 120
