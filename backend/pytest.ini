[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# E2E tiers (see tests/e2e/conftest.py). Both are skipped unless E2E_BASE_URL is
# set, so a plain `pytest` on a laptop with no stack running is unaffected.
#   e2e       — smoke against a live stack, no LLM, safe to run on every push
#   e2e_full  — full pipeline run; costs LLM tokens and minutes. Nightly/on-demand.
# CI runs `-m "not e2e and not e2e_full"` for unit, then the smoke tier separately.
markers =
    e2e: smoke end-to-end test against a live stack (no LLM, no training)
    e2e_full: full pipeline end-to-end test (requires an LLM key; slow)

    slow: executes repair training or multiple sandbox subprocesses
