# AutoML Autopilot: v5 deployment topology (see docs/V5_OPERATIONS.md).
#
#   python scripts/v5_stack.py up --project automl-v5-local --port 3133
#   open http://localhost:3133/repair
#
# v5 control, repair, verification and sandbox services. Only `web` publishes a port.
#
#   web ──/api──► api ──(postgres: queue + state)◄── worker ──HTTP──► verifier
#                                                     │
#                                          Nebius / NVIDIA / Tavily (egress)
#
#   backplane  internal network (no internet): web, api, worker, verifier, postgres
#   verification internal: verifier and verifier-only PostgreSQL
#   egress     workers (providers), API (public Git/OAuth/authorized delivery)
#   edge       published port: web only
#
# Least privilege: provider keys reach workers only; the verifier has no internet,
# no provider keys and a read-only view of the artifacts; every container drops all
# Linux capabilities (postgres adds back only what its entrypoint needs), cannot gain
# privileges, runs as non-root (app images) and has CPU / memory / PID limits.

name: automl-autopilot

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-backend: &backend
  <<: *hardening
  image: ${BACKEND_IMAGE:-automl-autopilot-backend:latest}
  build:
    context: ./backend
    dockerfile: Dockerfile.autopilot
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://autopilot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/autopilot
    DEBUG: "false"
    AUTH_ENABLED: "false"
    SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
    AUTOPILOT_EXECUTION: worker
    AUTOPILOT_LEASE_S: "60"
    LOG_LEVEL: INFO

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]   # entrypoint drops to the postgres user
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set a separate database admin password}
      APP_ROLE: autopilot
      APP_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: autopilot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [backplane]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopilot -d autopilot"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M, pids: 200 }

  verifier-postgres:
    <<: *hardening
    image: postgres:16-alpine
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${REPAIR_LEDGER_ADMIN_PASSWORD:?set a separate ledger admin password}
      APP_ROLE: verifier
      APP_PASSWORD: ${REPAIR_LEDGER_PASSWORD:?set a distinct verifier ledger password}
      POSTGRES_DB: verifier
    volumes:
      - ledger-pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [verification]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifier -d verifier"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M, pids: 200 }

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--no-server-header"]
    environment:
      <<: *backend-env
      CORS_ALLOW_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:3000}
      AUTOPILOT_CREATES_PER_10MIN: ${AUTOPILOT_CREATES_PER_10MIN:-6}
      AUTOPILOT_ALERT_TOKEN: ${AUTOPILOT_ALERT_TOKEN:-}
      AUTOPILOT_SHARE_SECRET: ${AUTOPILOT_SHARE_SECRET:-}
      AUTOPILOT_UPLOAD_TTL_HOURS: ${AUTOPILOT_UPLOAD_TTL_HOURS:-24}
      AUTOPILOT_DAILY_LLM_CALLS: ${AUTOPILOT_DAILY_LLM_CALLS:-400}
      AUTOPILOT_DAILY_TAVILY_CALLS: ${AUTOPILOT_DAILY_TAVILY_CALLS:-200}
      DATA_DIR: /data
      # v5: intake, labels and delivery. The api never runs repository code itself;
      # test discovery goes through the sandbox-runner.
      REPAIR_SANDBOX_URL: http://sandbox-runner:8200
      REPAIR_SANDBOX_TOKEN: ${REPAIR_SANDBOX_TOKEN:?set REPAIR_SANDBOX_TOKEN in .env}
      REPAIR_VERIFIER_URL: http://verifier:8100
      REPAIR_ADMISSION_TOKEN: ${REPAIR_ADMISSION_TOKEN:?set a distinct admission token}
      REPAIR_PACKS_DIR: /packs
      REPAIR_FIXTURES_DIR: /fixtures/repos
      REPAIR_REPLAYS_DIR: /replays
      REPAIR_LIVE_ENABLED: ${REPAIR_LIVE_ENABLED:-false}
      REPAIR_INVITE_CODES: ${REPAIR_INVITE_CODES:-}
      REPAIR_DAILY_USD_CAP: ${REPAIR_DAILY_USD_CAP:-5}
      REPAIR_DAILY_TOKEN_CAP: ${REPAIR_DAILY_TOKEN_CAP:-2000000}
      REPAIR_SESSION_SECRET: ${REPAIR_SESSION_SECRET:?set a stable session signing secret}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URL: ${GITHUB_OAUTH_REDIRECT_URL:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - artifacts:/data                  # uploads, signing key and owner-authorized artifact deletion
      - packs:/packs                     # v5 holdout label packs (written here, read by the verifier)
      - ${REPAIR_SOURCE_FIXTURES_DIR:-./fixtures/sources}:/fixtures/repos:ro # source-only catalog; no sealed material
      - ./docs/benchmarks/repair:/replays:ro
      - ./docs/benchmarks:/docs/benchmarks:ro  # recorded showcase and benchmark evidence
    networks: [backplane, egress]         # public repository intake and GitHub OAuth/delivery need HTTPS
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/autopilot/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M, pids: 200 }

  worker:
    <<: *backend
    command: ["python", "-m", "app.autopilot.worker"]
    environment:
      <<: *backend-env
      DATA_DIR: /data
      AUTOPILOT_RUNNER: process
      AUTOPILOT_WORKER_CONCURRENCY: ${AUTOPILOT_WORKER_CONCURRENCY:-2}
      AUTOPILOT_UPLOAD_TTL_HOURS: ${AUTOPILOT_UPLOAD_TTL_HOURS:-24}
      AUTOPILOT_EXPERIMENT_TIMEOUT_S: "120"
      AUTOPILOT_VERIFIER_URL: http://verifier:8100
      AUTOPILOT_VERIFIER_TOKEN: ${AUTOPILOT_VERIFIER_TOKEN:?set AUTOPILOT_VERIFIER_TOKEN in .env}
      AUTOPILOT_DAILY_LLM_CALLS: ${AUTOPILOT_DAILY_LLM_CALLS:-400}
      AUTOPILOT_DAILY_TAVILY_CALLS: ${AUTOPILOT_DAILY_TAVILY_CALLS:-200}
      # Provider credentials: this is the only container that receives them.
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_PLANNER_MODEL: ${NEBIUS_PLANNER_MODEL:-nvidia/Nemotron-3-Ultra-550b-a55b}
      NEBIUS_FAST_MODEL: ${NEBIUS_FAST_MODEL:-nvidia/Nemotron-3_5-Lightning}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    read_only: true
    tmpfs: ["/tmp"]
    shm_size: 256m                       # multiprocessing for experiment child processes
    volumes:
      - artifacts:/data
    networks: [backplane, egress]
    depends_on:
      postgres: { condition: service_healthy }
      verifier: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/autopilot-worker-alive'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 60 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    stop_grace_period: 60s               # finish held investigations before exit
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3G, pids: 512 }

  verifier:
    <<: *backend
    command: ["uvicorn", "app.autopilot.verifier_service:app", "--host", "0.0.0.0", "--port", "8100",
              "--no-server-header"]
    environment:
      DATA_DIR: /data
      AUTOPILOT_VERIFIER_TOKEN: ${AUTOPILOT_VERIFIER_TOKEN:?set AUTOPILOT_VERIFIER_TOKEN in .env}
      DEBUG: "false"
      # v5 grading: the only service with holdout labels and sealed tests.
      REPAIR_VERIFIER_TOKEN: ${REPAIR_VERIFIER_TOKEN:?set REPAIR_VERIFIER_TOKEN in .env}
      REPAIR_ADMISSION_TOKEN: ${REPAIR_ADMISSION_TOKEN:?set a distinct admission token}
      REPAIR_TRUSTED_SANDBOX_TOKEN: ${REPAIR_TRUSTED_SANDBOX_TOKEN:?set a distinct trusted evaluator token}
      REPAIR_LEDGER_DATABASE_URL: postgresql+asyncpg://verifier:${REPAIR_LEDGER_PASSWORD:?set a distinct verifier ledger password}@verifier-postgres:5432/verifier
      REPAIR_SANDBOX_URL: http://sandbox-runner:8200
      REPAIR_SANDBOX_TOKEN: ${REPAIR_SANDBOX_TOKEN:?set REPAIR_SANDBOX_TOKEN in .env}
      REPAIR_VERIFIER_STATE_DIR: /verifier-state
      REPAIR_PACKS_DIR: /packs
      REPAIR_FIXTURES_DIR: /fixtures/repos
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - artifacts:/data:ro               # reads artifacts and snapshots, can change nothing
      - verifier-state:/verifier-state   # holdout ledger, admission records, baseline caches
      - packs:/packs:ro                  # user holdout labels (never mounted in a worker)
      - ./fixtures:/fixtures:ro          # bundled sample repos and their sealed graders
    networks: [backplane, verification] # ledger database is unreachable from worker/API networks
    depends_on:
      verifier-postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8100/v5/oracle/ready', timeout=4))['ready'] else 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G, pids: 200 }

  repair-worker:
    <<: *backend
    command: ["python", "-m", "app.repair.service"]
    environment:
      <<: *backend-env
      DATA_DIR: /data
      REPAIR_SANDBOX_URL: http://sandbox-runner:8200
      REPAIR_SANDBOX_TOKEN: ${REPAIR_SANDBOX_TOKEN:?set REPAIR_SANDBOX_TOKEN in .env}
      REPAIR_VERIFIER_URL: http://verifier:8100
      REPAIR_VERIFIER_TOKEN: ${REPAIR_VERIFIER_TOKEN:?set REPAIR_VERIFIER_TOKEN in .env}
      # Provider credentials: only the worker receives them. No labels, no Docker socket.
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_API_KEY_2: ${NVIDIA_API_KEY_2:-}
      NVIDIA_API_KEY_3: ${NVIDIA_API_KEY_3:-}
      NVIDIA_API_KEY_4: ${NVIDIA_API_KEY_4:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      NEBIUS_PLANNER_MODEL: ${NEBIUS_PLANNER_MODEL:-nvidia/Nemotron-3-Ultra-550b-a55b}
      NEBIUS_CODER_MODEL: ${NEBIUS_CODER_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      NEBIUS_FAST_MODEL: ${NEBIUS_FAST_MODEL:-nvidia/Nemotron-3_5-Lightning}
      NVIDIA_PLANNER_MODEL: ${NVIDIA_PLANNER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      NVIDIA_CODER_MODEL: ${NVIDIA_CODER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      NVIDIA_FAST_MODEL: ${NVIDIA_FAST_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - artifacts:/data
    networks: [backplane, egress]
    depends_on:
      postgres: { condition: service_healthy }
      verifier: { condition: service_healthy }
      sandbox-runner: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "app.repair.operations", "worker-health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G, pids: 512 }

  sandbox-runner:
    <<: *backend
    # The only service that can start containers. It holds no provider keys and no labels.
    # Docker-out-of-Docker: environments live at the SAME path on the host and in here.
    # Prefer a rootless Docker daemon or gVisor (runsc) on the host for untrusted repositories.
    command: ["uvicorn", "app.repair.sandbox.server:app", "--host", "0.0.0.0", "--port", "8200", "--no-server-header"]
    user: "0:0"
    # Only the file capabilities needed to manage work dirs that candidate containers (uid 10001)
    # wrote into; everything else stays dropped.
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    environment:
      DATA_DIR: /tmp
      REPAIR_RUNNER: docker
      DOCKER_BUILDKIT: "1"
      DOCKER_CONFIG: /tmp/docker-config
      REPAIR_SANDBOX_TOKEN: ${REPAIR_SANDBOX_TOKEN:?set REPAIR_SANDBOX_TOKEN in .env}
      REPAIR_TRUSTED_SANDBOX_TOKEN: ${REPAIR_TRUSTED_SANDBOX_TOKEN:?set a distinct trusted evaluator token}
      REPAIR_PIP_INDEX_URL: ${REPAIR_PIP_INDEX_URL:-https://pypi.org/simple}
      REPAIR_ENV_ROOT: ${REPAIR_ENV_HOST_DIR:-/tmp/autopilot-envs}
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPAIR_ENV_HOST_DIR:-/tmp/autopilot-envs}:${REPAIR_ENV_HOST_DIR:-/tmp/autopilot-envs}
    networks: [backplane]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8200/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G, pids: 300 }

  web:
    <<: *hardening
    image: ${WEB_IMAGE:-automl-autopilot-web:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        API_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_AUTOPILOT_ONLY: "true"
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_ORIGIN:-http://localhost:3000}
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache:uid=10001,gid=10001"]
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    networks: [edge, backplane]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/autopilot"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M, pids: 200 }

# Explicit small subnets: deterministic, and independent of Docker's default address
# pools (which hosts with many projects can exhaust). Override if they collide.
networks:
  backplane:
    internal: true
    ipam:
      config: [{ subnet: "${BACKPLANE_SUBNET:-10.88.10.0/24}" }]
  egress:
    ipam:
      config: [{ subnet: "${EGRESS_SUBNET:-10.88.11.0/24}" }]
  edge:
    ipam:
      config: [{ subnet: "${EDGE_SUBNET:-10.88.12.0/24}" }]
  verification:
    internal: true
    ipam:
      config: [{ subnet: "${VERIFICATION_SUBNET:-10.88.13.0/24}" }]

volumes:
  pgdata:
  artifacts:
  verifier-state:
  packs:
  ledger-pgdata:
