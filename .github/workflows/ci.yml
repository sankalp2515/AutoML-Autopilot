name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Autopilot tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt pytest==8.3.4 pytest-asyncio==0.24.0
      - name: "Test (no provider keys; every live call is a recorded fake)"
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: python -m pytest tests/test_autopilot -q

  frontend:
    name: Web typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx tsc --noEmit -p .

  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        env:
          POSTGRES_PASSWORD: ci-only
          AUTOPILOT_VERIFIER_TOKEN: ci-only
        run: docker compose build
