name: CI

on:
  push:
    branches: [main, v5/main]
  pull_request:
  workflow_dispatch:

jobs:
  fixtures:
    name: Churn service proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fixtures/repos/churn-service/repo/requirements.txt
      - name: Install service dependencies
        run: python -m pip install -r fixtures/repos/churn-service/repo/requirements.txt
      - name: Prove unpatched, wrong and reference outcomes
        run: python scripts/prove_fixture.py fixtures/repos/churn-service

  backend:
    name: Autopilot tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt pytest==8.3.4 pytest-asyncio==0.24.0
      - name: "Test (no provider keys; every live call is a recorded fake)"
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: python -m pytest tests/test_autopilot tests/test_repair -q -m "not slow"


  repair-slow:
    name: Repair checker proofs and scripted agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-runtime.txt pytest==8.3.4 pytest-asyncio==0.24.0
      - name: Validate pinned public MLOps task subset
        run: python scripts/evaluate_mlops_subset.py prove --out docs/benchmarks/repair/mlops-subset-proof.json
      - name: Prove wrong-green rejection and reference acceptance on six repositories
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
          REPAIR_PROOF_OUTPUT: ../docs/benchmarks/repair/fixture-proofs
          REPAIR_TEST_TRAIN_CACHE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -m pytest tests/test_repair -m slow -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-checker-proofs
          path: docs/benchmarks/repair/fixture-proofs

  backend-postgres:
    name: Autopilot tests on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: autopilot }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt
      - run: pip install -r requirements-runtime.txt pytest==8.3.4 pytest-asyncio==0.24.0
      - name: "Test against Postgres (types and lengths SQLite does not enforce)"
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/autopilot
        run: python -m pytest tests/test_autopilot tests/test_repair -q -m "not slow"

  frontend:
    name: Web typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - name: Production build and Autopilot browser contracts
        env:
          NEXT_PUBLIC_AUTOPILOT_ONLY: "true"
          NEXT_PUBLIC_API_URL: ""
          E2E_MOCK_API: "1"
        run: |
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test e2e/autopilot.spec.ts e2e/repair.spec.ts e2e/repair-handoff.spec.ts

  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        env:
          POSTGRES_PASSWORD: ci-only
          AUTOPILOT_VERIFIER_TOKEN: ci-only
        run: docker compose build
